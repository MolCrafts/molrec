# Managed by prek: `prek install`
# CI parity: the same commands as .github/workflows/ci.yml, minus what needs a
# build machine. The pre-push test runs the pure suite (`-m "not molrs"`)
# with the `test` extra only, so it never builds molrs -- the molrs-marked
# conformance runs belong on a build machine (see CLAUDE.md).

default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: check-toml
      - id: check-json

  - repo: local
    hooks:
      - id: ci-lint
        name: "CI lint (same as ci.yml)"
        entry: bash -c 'uvx ruff@0.16.5 format --check . && uvx ruff@0.16.5 check .'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      - id: ci-test
        name: "pure tests (no molrs build)"
        entry: bash -c 'uv run --locked --extra test pytest -q -m "not molrs"'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
