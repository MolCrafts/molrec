[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "molrec"
version = "0.1.0"
description = "The MolCrafts record contract: models, conformance suite, and benchmarks."
requires-python = ">=3.12"
license = { text = "BSD-3-Clause" }
authors = [{ name = "MolCrafts" }]
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.7",
]

# Backends are optional: a consumer that only needs the models and the
# conformance harness must not be forced to install every store backend.
[project.optional-dependencies]
zarr = ["zarr>=3.0"]
dev = [
  "pytest>=8.0",
  "ruff>=0.11",
  "zarr>=3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/molrec"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
