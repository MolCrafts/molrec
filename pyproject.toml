[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "molrec"
version = "0.1.0"
description = "The MolCrafts record contract: models, conformance suite, and benchmarks."
requires-python = ">=3.12"
license = { text = "BSD-3-Clause" }
authors = [{ name = "MolCrafts" }]
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.7",
]

# Backends are optional: a consumer that only needs the models and the
# conformance harness must not be forced to install every store backend.
[project.optional-dependencies]
zarr = ["zarr>=3.0"]
dev = [
  "pytest>=8.0",
  "ruff>=0.11",
  "zarr>=3.0",
  # The reference implementation, so the conformance suite can actually judge
  # it. molrec's own codec passing molrec's own suite proves very little.
  "molcrafts-molrs",
]

# Built from the sibling checkout because the trajectory layout the suite
# judges is not in any published wheel yet. This flips to a plain
# `molcrafts-molrs>=0.14` pin in the dev extra once molrs 0.14 ships, and this
# section goes away with it.
[tool.uv.sources]
molcrafts-molrs = { path = "../molrs/molrs-python" }

[tool.hatch.build.targets.wheel]
packages = ["src/molrec"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
