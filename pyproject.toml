[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "molrec"
version = "0.1.0"
description = "The MolCrafts record contract: models, conformance suite, and benchmarks."
requires-python = ">=3.12"
license = { text = "BSD-3-Clause" }
authors = [{ name = "MolCrafts" }]
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.7",
]

# Backends are optional: a consumer that only needs the models and the
# conformance harness must not be forced to install every store backend.
[project.optional-dependencies]
zarr = ["zarr>=3.0"]
lmdb = ["lmdb>=1.4"]
dev = [
  "pytest>=8.0",
  "ruff>=0.11",
  "zarr>=3.0",
  "lmdb>=1.4",
  # The reference implementation, so the conformance suite can actually judge
  # it. molrec's own codec passing molrec's own suite proves very little.
  "molcrafts-molrs",
]
docs = [
  "zensical>=0.0.53",
  "molcrafts-zensical-theme>=0.2.5",
]

# The reference implementation is built from the sibling checkout
# (MolCrafts/molrs, branch dev) so the suite judges the layout molrs writes
# *now*, not the last published wheel. CI clones the sibling next to this
# repository (see .github/workflows/ci.yml); locally, keep ../molrs on dev.
[tool.uv.sources]
molcrafts-molrs = { path = "../molrs/molrs-python" }

[tool.hatch.build.targets.wheel]
packages = ["src/molrec"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
