name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

# molrec's dev extra depends on the reference implementation from the sibling
# checkout: pyproject.toml pins `molcrafts-molrs` to `../molrs/molrs-python`
# ([tool.uv.sources]). CI reproduces that layout inside $GITHUB_WORKSPACE --
# this repository under `molrec/`, MolCrafts/molrs@dev under `molrs/` -- so the
# relative path resolves, and runs every command from `molrec/`. molrs-python
# is a maturin (Rust) package, hence the Rust toolchain.

defaults:
  run:
    working-directory: molrec

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: molrec
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff format --check .
      # full ruff check deferred until the suite is cleaned for it

  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: molrec
      # The sibling checkout `../molrs` that [tool.uv.sources] points at.
      - uses: actions/checkout@v4
        with:
          repository: MolCrafts/molrs
          ref: dev
          path: molrs
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - name: pytest
        run: uv run pytest -q
