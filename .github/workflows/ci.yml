name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

# molrs is checked out at the commit scripts/partners.py resolves from
# .github/partners.env (molrs's dev, or its branch named like this one); the
# pre-push hooks resolve it the same way. Every job here has a hook with the
# same command (.pre-commit-config.yaml).

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: molrec
    steps:
      - uses: actions/checkout@v4
        with:
          path: molrec
      - name: Resolve partners
        run: python3 scripts/partners.py resolve >> "$GITHUB_ENV"
      # Metadata only (molrs-python's pyproject.toml is static): the lock is
      # checked against it, nothing compiles.
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.MOLRS_REPOSITORY }}
          ref: ${{ env.MOLRS_REF }}
          path: molrs
      - uses: astral-sh/setup-uv@v5
      # The same hooks as a local commit: file hygiene and ruff.
      - run: uvx pre-commit run --all-files --show-diff-on-failure
      # Every partner resolves; no path source CI cannot resolve.
      - run: python3 scripts/partners.py check
      # uv.lock is current against the resolved molrs.
      - run: uv lock --check
      # molrec alone, no extras, must import.
      - run: uv run --isolated --locked --python 3.12 python -c "import molrec"

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: molrec
    steps:
      - uses: actions/checkout@v4
        with:
          path: molrec
      - name: Resolve partners
        run: python3 scripts/partners.py resolve >> "$GITHUB_ENV"
      # pyproject.toml builds the reference implementation from ../molrs.
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.MOLRS_REPOSITORY }}
          ref: ${{ env.MOLRS_REF }}
          path: molrs
      - run: rustup toolchain install
        working-directory: molrs
      - uses: astral-sh/setup-uv@v5
      - run: uv run --locked --python 3.12 --extra dev python -X warn_default_encoding -m pytest -q
        env:
          MOLREC_REQUIRE_MOLRS: "1"
          # The molrs wheel uv builds is --locked against molrs's Cargo.lock.
          MATURIN_PEP517_ARGS: --locked

  # The site Cloudflare Pages deploys, built the way it builds it: a fresh
  # `pip install ".[docs]"`, then zensical. --strict fails on any warning.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --isolated --no-project --python 3.12 --with '.[docs]' zensical build --clean --strict
