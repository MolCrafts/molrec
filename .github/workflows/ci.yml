name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

# The docs site is built and deployed by Cloudflare Pages, which reports its
# own check on every pull request.

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # The same hooks as a local commit: file hygiene and ruff.
      - run: uvx pre-commit run --all-files --show-diff-on-failure
      # molrec alone, no extras, must import.
      - run: uv run --frozen python -c "import molrec"

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: molrec
    steps:
      - uses: actions/checkout@v4
        with:
          path: molrec
      # pyproject.toml builds the reference implementation from ../molrs.
      # Roy-Kid/molrs ir/wp-c-lammps-conventions (MolCrafts/molrs#103, LAMMPS
      # conventions): a fork commit. Move back to MolCrafts/molrs dev once #103
      # merges.
      - uses: actions/checkout@v4
        with:
          repository: Roy-Kid/molrs
          ref: 1439845c52e3ae710e5c3f3e239261122522b520
          path: molrs
      - run: rustup toolchain install
        working-directory: molrs
      - uses: astral-sh/setup-uv@v5
      - run: uv run --locked --extra dev pytest -q
        env:
          MOLREC_REQUIRE_MOLRS: "1"
