name: test

# The whole suite -- the molrs-marked conformance cases included, judging
# molrs built from the commit scripts/partners.py resolves (molrs's dev, or
# its branch named like this one) -- in two tiers (`tier` decides):
#
#   fast  a feature-branch push to MolCrafts: Linux.
#   full  everything else -- dev/master, pull requests, dispatches, and every
#         push to a fork, so a fork branch is proven before its pull request
#         is opened: Linux, macOS and Windows.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/master' }}

defaults:
  run:
    shell: bash

env:
  MOLREC_REQUIRE_MOLRS: "1"
  # The molrs wheel uv builds is --locked against molrs's Cargo.lock.
  MATURIN_PEP517_ARGS: --locked

jobs:
  tier:
    name: test / tier
    # A pull request inside a fork was already built by its push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.repository_owner == 'MolCrafts'
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.tier.outputs.full }}
    steps:
      - id: tier
        run: echo "full=${{ !(github.repository_owner == 'MolCrafts' && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/master') }}" | tee -a "$GITHUB_OUTPUT"

  python:
    name: test / python (${{ matrix.os }})
    needs: tier
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.tier.outputs.full == 'true' && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python
      - uses: ./.github/actions/setup-partners
      # molrs/rust-toolchain.toml pins the compiler that builds the molrs wheel.
      - uses: ./.github/actions/setup-rust
        with:
          toolchain-dir: ../molrs
          cache: molrs-python
          workspaces: ../molrs/molrs-python -> ../target
      # molrec alone, no extras, must import.
      - run: uv run --isolated --locked --python 3.12 python -c "import molrec"
      - run: uv run --locked --python 3.12 --extra dev python -X warn_default_encoding -m pytest -q
