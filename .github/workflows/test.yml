name: test

# Every check molrec has, in one workflow, in two tiers (`test / context`
# decides):
#
#   fast  a feature-branch push to MolCrafts: the suite on Linux.
#   full  every push to a fork (proven before its pull request), dev, master
#         and main on MolCrafts, pull requests, tags and dispatches: the suite
#         on Linux, macOS and Windows.
#
# The suite (the molrs-marked conformance cases included) judges molpy built
# from the commit .github/partners.env declares (MOLPY_REF, used exactly as
# written). `test / hooks` runs the commit hooks on every file, the partners
# check and `uv lock --check`; `test / docs` builds the site as Cloudflare Pages
# does (a fresh `.[docs]` install, then zensical --strict). Cloudflare Pages
# deploys it from MolCrafts itself, so no job here deploys.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:

permissions:
  contents: read

# One group per file, workflow, event and ref; only a feature ref cancels its superseded runs.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/master"]'), github.ref) && !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

env:
  MOLREC_REQUIRE_MOLRS: "1"
  # The molrs wheel uv builds is --locked against molrs's Cargo.lock.
  MATURIN_PEP517_ARGS: --locked

jobs:
  # Where this run happens, decided once: MolCrafts/molcrafts-ci/actions/ci-context.
  context:
    permissions:
      contents: read
    name: test
    uses: MolCrafts/molcrafts-ci/.github/workflows/context.yml@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76

  hooks:
    name: test / hooks
    needs: context
    # A pull request inside a fork was already run by its push.
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76
      - uses: MolCrafts/molcrafts-ci/actions/setup-partners@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76
      - run: uvx pre-commit run --all-files --show-diff-on-failure
      - run: python3 scripts/partners.py check
      - run: uv lock --check

  docs:
    name: test / docs
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76
      - run: uv run --isolated --no-project --python 3.12 --with '.[docs]' zensical build --clean --strict

  python:
    name: test / python (${{ matrix.os }})
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.context.outputs.tier == 'full' && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76
      - uses: MolCrafts/molcrafts-ci/actions/setup-partners@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76
      # molpy/rust-toolchain.toml pins the compiler that builds the molpy wheel.
      - uses: MolCrafts/molcrafts-ci/actions/setup-rust@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76
        with:
          toolchain-dir: ../molpy
          cache: molpy
          workspaces: ../molpy/molpy -> ../target
      # molrec alone, no extras, must import.
      - run: uv run --isolated --locked --python 3.12 python -c "import molrec"
      - run: uv run --locked --python 3.12 --extra dev python -X warn_default_encoding -m pytest -q

  # Every workflow against the CI scheme: MolCrafts/molcrafts-ci/actions/check-workflows.
  workflow-policy:
    name: test / workflows
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/check-workflows@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76

  result:
    name: test / result
    needs: [context, hooks, docs, python, workflow-policy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; . == "success" or . == "skipped")'
