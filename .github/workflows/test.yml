name: test

# pytest in two tiers (`test / context` decides, through MolCrafts/molcrafts-ci/actions/ci-context):
#
#   fast  a feature-branch push to MolCrafts: Linux, Python 3.12.
#   full  every push to a fork, dev, master and main on MolCrafts, pull
#         requests, tags and dispatches: Linux, macOS and Windows on the
#         oldest and newest Python this package supports.
'on':
  push:
    branches:
    - '**'
  pull_request:
    branches:
    - dev
    - master
    - main
  workflow_dispatch: null
  workflow_call: null

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/master","refs/heads/main"]'), github.ref) && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  context:
    permissions:
      contents: read
    name: test / context
    uses: MolCrafts/molcrafts-ci/.github/workflows/context.yml@master

  python:
    name: test / python (${{ matrix.os }}, ${{ matrix.python }})
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.context.outputs.tier == 'full' && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
        python: ${{ fromJSON(needs.context.outputs.tier == 'full' && '["3.12","3.14"]' || '["3.12"]') }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@master
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --extra dev
      - run: uv run pytest -q
